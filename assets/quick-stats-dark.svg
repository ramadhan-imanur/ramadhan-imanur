  <g transform="translate(0, 108)">
    <rect x="1" y="1" width="292" height="94" rx="8" class="card" />
    <path d="M143 18a3 3 0 100-6 3 3 0 000 6zm7 0a2.5 2.5 0 100-5 2.5 2.5 0 000 5zm-7 2.5c-2 0-6 1-6 3v2h12v-2c0-2-4-3-6-3zm7 0c-.3 0-.6 0-.9.1 1.1.8 1.9 1.8 1.9 2.9v2h5v-2c0-2-4-3-6-3z" fill="#8B949E" />
