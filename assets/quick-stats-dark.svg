      .card { fill: #161B22; stroke: #30363D; stroke-width: 1; rx: 8px; }
      .num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; font-size: 24px; font-weight: 700; fill: #F0F6FC; text-anchor: middle; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; font-weight: 600; fill: #8B949E; text-anchor: middle; letter-spacing: 0.8px; }
    </style>
  </defs>

  <!-- Top-Left: Repos -->
  <g transform="translate(0, 0)">
