<svg width="500" height="120" viewBox="0 0 500 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card-bg { fill: #0D1117; stroke: #30363D; stroke-width: 1; rx: 8px; }
      .greeting { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; font-size: 17px; font-weight: 700; fill: #F0F6FC; text-anchor: middle; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; font-size: 12px; font-weight: 400; fill: #8B949E; text-anchor: middle; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; font-weight: 600; fill: #388BFD; }
      .tag-bg { fill: #388BFD15; stroke: #388BFD40; stroke-width: 1; rx: 12px; }
    </style>
  </defs>

  <rect x="1" y="1" width="498" height="118" rx="8" class="card-bg" />

  <text x="250" y="36" class="greeting">Welcome to Ramadhan Imanur's Hub</text>
  <text x="250" y="58" class="subtext">Applied Computation · Mathematical Modeling · Data Science</text>

  <!-- Tag Centered -->
  <g transform="translate(182, 74)">
    <rect x="0" y="0" width="136" height="26" rx="13" class="tag-bg" />
    <circle cx="14" cy="13" r="4" fill="#2EA043" />
    <text x="26" y="17" class="tag">Active Portfolio</text>
  </g>
</svg>