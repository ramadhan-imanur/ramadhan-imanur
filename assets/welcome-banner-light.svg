<svg width="800" height="215" viewBox="0 0 800 215" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card-bg { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1; rx: 12px; }
      @keyframes subtle-dot-pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      @keyframes subtle-twinkle {
        0%, 100% { opacity: 0.25; transform: scale(0.85); }
        50% { transform: scale(0.95); opacity: 1.2; }
      }
      @keyframes soft-pulse-star {
        0%, 100% { opacity: 0.3; transform: rotate(0deg) scale(0.9); }
        50% { opacity: 1; transform: rotate(45deg) scale(1.15); }
      }
      .status-dot-pulse { animation: subtle-dot-pulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite; transform-origin: center; }
      .star-twinkle-slow { animation: subtle-twinkle 4s ease-in-out infinite; transform-origin: center; }
      .star-twinkle-mid { animation: subtle-twinkle 2.8s ease-in-out infinite; transform-origin: center; }
      .star-twinkle-fast { animation: subtle-twinkle 2s ease-in-out infinite; transform-origin: center; }
      .star-sparkle { animation: soft-pulse-star 5s ease-in-out infinite; transform-origin: 0 0; }

      .headline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Newsreader', Georgia, serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; fill: #1F2328; }
      .headline-italic { font-family: 'Newsreader', Georgia, serif; font-style: italic; fill: #1A7F37; font-weight: 500; }
      .mono-sub { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; font-size: 13px; fill: #656D76; }
      .mono-pill { font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace; font-size: 11px; font-weight: 500; fill: #24292F; }
      .math-symbol { font-family: 'JetBrains Mono', 'Newsreader', serif; font-style: italic; user-select: none; pointer-events: none; }

      .mobile-layout { display: none; }
      .desktop-layout { display: inline; }

      @media (max-width: 650px) {
        .desktop-layout { display: none; }
        .mobile-layout { display: inline; }
      }
      @media (prefers-reduced-motion: reduce) {
        .status-dot-pulse, .star-twinkle-slow, .star-twinkle-mid, .star-twinkle-fast, .star-sparkle {
          animation: none !important;
        }
      }
    </style>

    <radialGradient id="star-green-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A7F37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1A7F37" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="star-cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0969DA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0969DA" stop-opacity="0" />
    </radialGradient>

    <!-- 3 Nebula Ambient Glows -->
    <radialGradient id="ambient-green-corner" cx="75%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#1A7F37" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#1A7F37" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambient-cyan-center" cx="45%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#0969DA" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0969DA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="ambient-purple-edge" cx="95%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#8250DF" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#8250DF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Card Background & Nebulas -->
  <rect x="1" y="1" width="798" height="213" rx="12" class="card-bg" />
  <rect x="1" y="1" width="798" height="213" rx="12" fill="url(#ambient-green-corner)" />
  <rect x="1" y="1" width="798" height="213" rx="12" fill="url(#ambient-cyan-center)" />
  <rect x="1" y="1" width="798" height="213" rx="12" fill="url(#ambient-purple-edge)" />

  <!-- Twinkling Starfield -->
  <circle cx="34" cy="48" r="1.2" fill="#1F2328" class="star-twinkle-slow" />
  <circle cx="112" cy="28" r="1.4" fill="#1A7F37" class="star-twinkle-mid" />
  <circle cx="185" cy="82" r="1.0" fill="#1F2328" class="star-twinkle-fast" />
  <circle cx="420" cy="35" r="1.3" fill="#0969DA" class="star-twinkle-slow" />
  <circle cx="492" cy="110" r="1.0" fill="#1F2328" class="star-twinkle-mid" />
  <circle cx="738" cy="46" r="1.3" fill="#1F2328" class="star-twinkle-fast" />
  <circle cx="762" cy="160" r="1.2" fill="#1A7F37" class="star-twinkle-mid" />
  <circle cx="38" cy="175" r="1.1" fill="#0969DA" class="star-twinkle-slow" />
  <circle cx="410" cy="180" r="1.2" fill="#1F2328" class="star-twinkle-fast" />

  <!-- 4-Point Diamond Sparkles -->
  <g transform="translate(710, 52)">
    <g class="star-sparkle" style="transform-origin: 0 0;">
      <path d="M0 -4.5 Q0 0 4.5 0 Q0 0 0 4.5 Q0 0 -4.5 0 Q0 0 0 -4.5 Z" fill="#1A7F37" />
      <circle cx="0" cy="0" r="5" fill="url(#star-green-glow)" />
    </g>
  </g>
  <g transform="translate(640, 145)">
    <g class="star-sparkle" style="transform-origin: 0 0; animation-delay: 1.5s;">
      <path d="M0 -4 Q0 0 4 0 Q0 0 0 4 Q0 0 -4 0 Q0 0 0 -4 Z" fill="#0969DA" />
      <circle cx="0" cy="0" r="4.5" fill="url(#star-cyan-glow)" />
    </g>
  </g>
  <g transform="translate(36, 125)">
    <g class="star-sparkle" style="transform-origin: 0 0; animation-delay: 2.2s;">
      <path d="M0 -3.5 Q0 0 3.5 0 Q0 0 0 3.5 Q0 0 -3.5 0 Q0 0 0 -3.5 Z" fill="#1F2328" opacity="0.8" />
    </g>
  </g>

  <!-- Mathematical Geometry & Parametric Curves -->
  <g opacity="0.15" stroke="#1A7F37" stroke-width="0.9" fill="none">
    <path d="M 420 180 Q 540 130 630 180 T 790 180" stroke-dasharray="3 3" />
    <path d="M 460 70 C 550 20, 640 120, 740 60" stroke="#0969DA" stroke-dasharray="2 4" />
  </g>

  <!-- Coordinate Axis Crosshairs -->
  <g opacity="0.15" stroke="#656D76" stroke-width="0.8">
    <line x1="740" y1="95" x2="770" y2="95" />
    <line x1="755" y1="80" x2="755" y2="110" />
    <circle cx="755" cy="95" r="2.5" fill="none" stroke="#1A7F37" />
  </g>

  <!-- Advanced Mathematical & LaTeX Formulas from Stitch Desktop -->
  <g class="math-symbol" font-size="15" fill="#1A7F37" opacity="0.18">
    <text x="680" y="115">∫ ℝⁿ</text>
  </g>
  <g class="math-symbol" font-size="13" fill="#0969DA" opacity="0.16">
    <text x="650" y="145">∮_C E·dr = 0</text>
  </g>
  <g class="math-symbol" font-size="14" fill="#1A7F37" opacity="0.18">
    <text x="735" y="42">∇ f(x)</text>
  </g>
  <g class="math-symbol" font-size="12" fill="#656D76" opacity="0.18">
    <text x="440" y="45">∂f/∂x</text>
  </g>
  <g class="math-symbol" font-size="12" fill="#8250DF" opacity="0.16">
    <text x="590" y="52">det(A - λᵢI) = 0</text>
  </g>
  <g class="math-symbol" font-size="12" fill="#0969DA" opacity="0.16">
    <text x="500" y="180">𝔼[X] = μ · Var(X) = σ²</text>
  </g>
  <g class="math-symbol" font-size="11" fill="#1A7F37" opacity="0.16">
    <text x="450" y="200">ℋ ≅ L²(ℝⁿ) · ⟨ψ|Ĥ|ψ⟩</text>
  </g>
  <g class="math-symbol" font-size="11" fill="#656D76" opacity="0.16">
    <text x="750" y="185">λᵢ ≥ 0</text>
  </g>

  <!-- Desktop Layout -->
  <g class="desktop-layout">
    <!-- Top Pill Badge -->
    <g transform="translate(28, 24)">
      <rect x="0" y="0" width="112" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" />
      <circle cx="13" cy="13" r="3.5" fill="#1A7F37" class="status-dot-pulse" style="transform-origin: 13px 13px;" />
      <text x="24" y="17" class="mono-pill">imanur.dev</text>
      <text x="124" y="17" class="mono-sub" font-size="11">Overview</text>
    </g>

    <!-- Top Right Active Portfolio Indicator -->
    <g transform="translate(634, 24)">
      <rect x="0" y="0" width="138" height="26" rx="13" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" />
      <path d="M12 9l3 3-3 3M17 15h3" stroke="#656D76" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="17" class="mono-pill" font-size="10">ACTIVE PORTFOLIO</text>
    </g>

    <!-- Headline -->
    <g transform="translate(28, 92)">
      <text x="0" y="0" class="headline">Where applied mathematics meets <tspan class="headline-italic">predictive computation.</tspan></text>
      <text x="0" y="32" class="mono-sub">@ramadhan-imanur <tspan fill="#D0D7DE">/</tspan> <tspan fill="#24292F">Imanur.dev</tspan></text>
      <text x="0" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#656D76">Applied Computation · Mathematical Modeling · Data Science Research</text>
    </g>
  </g>

  <!-- Mobile Layout -->
  <g class="mobile-layout">
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="108" height="24" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#1A7F37" class="status-dot-pulse" style="transform-origin: 12px 12px;" />
      <text x="22" y="16" class="mono-pill" font-size="10">imanur.dev</text>
    </g>
    <g transform="translate(20, 75)">
      <text x="0" y="0" class="headline" font-size="20">Where applied mathematics meets</text>
      <text x="0" y="26" class="headline-italic" font-size="20">predictive computation.</text>
      <text x="0" y="56" class="mono-sub" font-size="11">@ramadhan-imanur / Imanur.dev</text>
      <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#656D76">Applied Computation · Modeling · Data Science</text>
    </g>
  </g>
</svg>