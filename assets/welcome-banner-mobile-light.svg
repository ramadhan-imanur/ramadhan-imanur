<svg width="600" height="110" viewBox="0 0 600 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card-bg { fill: #FFFFFF; stroke: #D0D7DE; stroke-width: 1; rx: 8px; }
      .greeting { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; font-size: 18px; font-weight: 700; fill: #1F2328; text-anchor: middle; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; font-size: 13px; font-weight: 400; fill: #656D76; text-anchor: middle; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, sans-serif; font-size: 11px; font-weight: 600; fill: #0969DA; }
      .tag-bg { fill: #0969DA15; stroke: #0969DA40; stroke-width: 1; rx: 12px; }
    </style>
  </defs>

  <rect x="1" y="1" width="598" height="108" rx="8" class="card-bg" />

  <text x="300" y="34" class="greeting">Welcome to Ramadhan Imanur's Hub</text>
  <text x="300" y="56" class="subtext">Applied Computation · Mathematical Modeling · Data Science</text>

  <!-- Tag Centered -->
  <g transform="translate(232, 68)">
    <rect x="0" y="0" width="136" height="26" rx="13" class="tag-bg" />
    <circle cx="14" cy="13" r="4" fill="#1A7F37" />
    <text x="26" y="17" class="tag">Active Portfolio</text>
  </g>
</svg>